[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "save-earth"
version = "0.1.0"
description = "Open environmental-action datasets (OpenLitterMap, EPA Superfund/Brownfields, EPA TRI) → cached GeoJSON → MapLibre HTML maps, as Facetwork workflows + handlers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Ralph Lemke"}]
keywords = ["facetwork", "ffl", "environment", "geojson", "openlittermap", "epa", "maplibre"]

dependencies = [
    "facetwork>=0.31.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.8.0",
]

[project.urls]
Repository = "https://github.com/rlemke/fwh_save_earth"

[project.entry-points."facetwork.domains"]
save-earth = "save_earth:domain"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
save_earth = [
    "ffl/*.ffl",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501", "E402", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/save_earth/handlers"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
